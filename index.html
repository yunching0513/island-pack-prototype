<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>島與群平台原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* 依《國際式樣：中西文排版指南》v1.3 實作。
   版面：12 欄的 8＋4。左 8 欄是居民看到的網站，右 4 欄是團隊的討論點，可收合。
   色彩：強調色用路牌綠，只標主要動作與目前位置。地圖不用紅色，避免「熱區」被讀成「危險區」。
   字體與邊角：團隊試用圓體（jf 粉圓）與圓角，這兩項刻意偏離指南的方角與黑體。
   粉圓是臺灣字形且涵蓋本站全部用字；日系圓體缺「鄉」等字。 */
:root{
  --paper:#f5f3ee; --paper2:#eceae2; --ink:#171717; --muted:#595959;
  --rule:#b7b4ae; --rule2:#d7d4cd;
  --accent:#00664a; --on-accent:#ffffff; --accent-soft:#d9e9e1;
  --warn:#7c4300; --warn-soft:#f2e4cf;
  --sea:#d8e2e2; --land:#fbfaf6; --land2:#e5e2d9; --road:#a59f92; --hatch:#c4c0b6;
  --q1:#cfe3d9; --q2:#9dcbb6; --q3:#62a98c; --q4:#2a8366; --q5:#00593f;
  --wall:#dcd8cc; --ground:#c5c1b4; --figure:#2a2a28;
  --round:"Huninn","jf-openhuninn-2.0","PingFang TC","Noto Sans TC","Microsoft JhengHei";
  --ui:var(--round),sans-serif;
  --display:var(--round),sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  --s1:4px;--s2:8px;--s3:16px;--s4:24px;--s5:32px;--s6:48px;--s7:64px;--s8:96px;
  --side:32px; --tabh:64px;
  /* 三個值都設為 0 就回到方角 */
  --r:14px; --r-sm:10px; --r-lg:22px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14130f; --paper2:#1f1d18; --ink:#ece8dd; --muted:#a8a295;
  --rule:#4a463d; --rule2:#302d26;
  --accent:#62d3ac; --on-accent:#08231a; --accent-soft:#17352b;
  --warn:#e7b163; --warn-soft:#3a2a12;
  --sea:#10181b; --land:#23211b; --land2:#191813; --road:#5d584c; --hatch:#3f3b32;
  --q1:#1f3d32; --q2:#2c6350; --q3:#3b8a6f; --q4:#53b593; --q5:#8ce0c1;
  --wall:#2e2c25; --ground:#3a372f; --figure:#e6e2d6;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#14130f; --paper2:#1f1d18; --ink:#ece8dd; --muted:#a8a295;
  --rule:#4a463d; --rule2:#302d26;
  --accent:#62d3ac; --on-accent:#08231a; --accent-soft:#17352b;
  --warn:#e7b163; --warn-soft:#3a2a12;
  --sea:#10181b; --land:#23211b; --land2:#191813; --road:#5d584c; --hatch:#3f3b32;
  --q1:#1f3d32; --q2:#2c6350; --q3:#3b8a6f; --q4:#53b593; --q5:#8ce0c1;
  --wall:#2e2c25; --ground:#3a372f; --figure:#e6e2d6;
  color-scheme:dark;
}
@media (max-width:1023px){:root{--side:24px}}
@media (max-width:699px){:root{--side:20px}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:18px;line-height:1.8;font-variant-numeric:tabular-nums}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0;padding:0}
ul,ol{list-style:none}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:max(14px,.92em)}
.muted{color:var(--muted)}
.small{font-size:15px;line-height:1.7}
.note{font-size:14px;line-height:1.6;color:var(--muted)}

/* ── 原型外框：只有團隊看得到 ── */
.band{background:var(--ink);color:var(--paper)}
.band-in{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);align-items:center;
  padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px));padding-block:var(--s2)}
.band p{font-size:14px;line-height:1.6}
.band-id b{font-weight:700}
.band-note{flex:1 1 280px;min-width:0}
.band-tools{display:flex;gap:var(--s2);align-items:center}
.band .seg button,.band .band-btn{min-height:36px;background:transparent;color:var(--paper);border:1px solid var(--paper);padding:0 12px;font-size:14px;line-height:1.2;cursor:pointer}
.band .seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.band .seg button+button{border-left:0}
.band .seg{display:flex}

/* ── 舞台：8＋4 ── */
.stage{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:var(--s4);align-items:start;
  padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px));padding-block:var(--s4) var(--s7)}
body[data-rail="off"] .stage{grid-template-columns:minmax(0,1fr)}
body[data-rail="off"] .rail{display:none}
.app{container:app/inline-size;min-width:0;background:var(--paper)}
body[data-device="phone"] .stage{grid-template-columns:392px minmax(0,1fr)}
body[data-device="phone"][data-rail="off"] .stage{grid-template-columns:392px}
body[data-device="phone"] .app{height:min(820px,calc(100vh - 96px));overflow-y:auto;border:2px solid var(--ink);position:sticky;top:var(--s3)}
body[data-device="phone"] .pad{padding-left:16px;padding-right:16px}
@media (max-width:1099px){
  .stage{grid-template-columns:minmax(0,1fr)}
  body[data-device="phone"] .stage{grid-template-columns:392px;justify-content:center}
}
@media (max-width:699px){
  .stage{padding-left:0;padding-right:0;padding-block:0}
  .pad{padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px))}
  .band-tools .seg{display:none}
}

/* ── 討論欄 ── */
.rail{position:sticky;top:var(--s3);max-height:calc(100vh - 32px);overflow-y:auto;border-top:3px solid var(--ink);padding-top:var(--s2);min-width:0}
.rail-head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2)}
.rail h2{font-size:20px;line-height:1.5;font-weight:700}
.rail-close{display:none}
.rail-sub{font-size:15px;line-height:1.7;color:var(--muted);margin-top:var(--s1)}
.q{padding-block:var(--s3);border-bottom:1px solid var(--rule2)}
.q h3{font-size:17px;line-height:1.55;font-weight:700}
.q p{font-size:15px;line-height:1.7;margin-top:var(--s1)}
.q-foot{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);margin-top:var(--s2);min-height:24px}
.q-ref{font-size:14px;color:var(--muted)}
.q-comment{display:none;min-height:32px;padding:0 10px;font-size:14px;line-height:1.2;background:none;border:1px solid var(--ink);cursor:pointer}
body.can-comment .q-comment{display:inline-block}
.q-comment:hover{background:var(--ink);color:var(--paper)}
.q-foot{flex-wrap:wrap}
.q-acts{display:flex;flex-wrap:wrap;gap:var(--s2)}
.q-issue{display:inline-flex;align-items:center;min-height:32px;padding:0 10px;font-size:14px;line-height:1.2;border:1px solid var(--ink);border-radius:var(--r-sm);text-decoration:none}
.q-issue:hover{background:var(--ink);color:var(--paper)}
.q-ctl{margin-top:var(--s2)}
.q-ctl .seg{width:100%}
.q-ctl .seg button{flex:1 1 0;padding-inline:4px}
.tour{padding-block:var(--s3);border-bottom:1px solid var(--rule2)}
.tour h3{font-size:17px;font-weight:700;line-height:1.55}
.tour ol{counter-reset:t;margin-top:var(--s2);display:grid;gap:var(--s2)}
.tour li{counter-increment:t;display:grid;grid-template-columns:24px minmax(0,1fr);font-size:15px;line-height:1.6}
.tour li::before{content:counter(t);font-weight:700}
.tour li button{all:unset;cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.tour li button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rail-foot{padding-block:var(--s3);display:flex;gap:var(--s2);flex-wrap:wrap}
@media (max-width:1099px){
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:78vh;background:var(--paper);z-index:30;border-top:3px solid var(--ink);box-shadow:0 -8px 24px rgba(0,0,0,.25);
    padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px));padding-block:var(--s3) calc(var(--s3) + env(safe-area-inset-bottom,0px))}
  .rail-close{display:inline-block}
  body[data-rail="off"] .rail{display:none}
}

/* ── 基本元件 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:48px;padding:0 var(--s4);border:1px solid var(--ink);background:transparent;cursor:pointer;font-weight:500;line-height:1.3;text-align:center}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.primary:hover{filter:brightness(.9);color:var(--on-accent);background:var(--accent)}
.btn.quiet{border-color:transparent;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;padding-inline:var(--s2)}
.btn.quiet:hover{background:none;color:var(--accent)}
.btn.sm{min-height:44px;padding:0 var(--s3);font-size:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;max-width:100%}
.seg button{min-height:44px;padding:0 12px;border:1px solid var(--ink);background:transparent;cursor:pointer;font-size:15px;line-height:1.3}
.seg button+button{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:14px;line-height:1.5;font-weight:500}
.chip{min-height:44px;padding:4px 14px;border:1px solid var(--ink);background:transparent;cursor:pointer;font-size:16px;line-height:1.4;text-align:left}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
select,textarea,input[type=text],input[type=datetime-local]{width:100%;background:var(--paper);border:1px solid var(--ink);border-radius:0;padding:10px 12px;line-height:1.5;font-size:16px;min-height:44px}
textarea{resize:vertical;line-height:1.7}
label.field{display:grid;gap:var(--s1);font-size:16px;line-height:1.5;font-weight:500}
.tbl-wrap{overflow-x:auto;margin-top:var(--s3)}
table{border-collapse:collapse;width:100%;font-size:16px;line-height:1.6}
th{text-align:left;font-weight:700;border-bottom:2px solid var(--ink);padding:var(--s2) var(--s3) var(--s2) 0;vertical-align:bottom;white-space:nowrap}
td{border-bottom:1px solid var(--rule2);padding:12px var(--s3) 12px 0;vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ── 網站頁首與導覽 ── */
.site{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s4);padding-block:var(--s3);border-bottom:2px solid var(--ink)}
.wordmark{all:unset;cursor:pointer;font-family:var(--display);font-weight:900;font-size:26px;line-height:1.3}
.wordmark:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav{display:none;flex-wrap:wrap;gap:var(--s1) var(--s3)}
.nav button{all:unset;cursor:pointer;font-size:16px;line-height:1.5;padding:6px 0;border-bottom:3px solid transparent}
.nav button:hover{color:var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav button[aria-current="page"]{border-bottom-color:var(--accent);font-weight:700}
.nav .staff{color:var(--muted)}
.site-admin{font-size:14px}
.tabbar{position:sticky;bottom:0;z-index:12;background:var(--paper);border-top:2px solid var(--ink);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{all:unset;cursor:pointer;min-height:var(--tabh);display:grid;place-items:center;align-content:center;gap:2px;font-size:14px;line-height:1.3;text-align:center;border-top:3px solid transparent;margin-top:-2px}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{border-top-color:var(--accent);font-weight:700}
.tabbar button:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
@container app (min-width:700px){
  .nav{display:flex}
  .tabbar{display:none}
  .site-admin{display:none}
}
.foot{padding-block:var(--s5);margin-top:var(--s6);border-top:1px solid var(--rule);font-size:14px;line-height:1.7;color:var(--muted)}
.foot p+p{margin-top:var(--s2)}

/* ── 頁面排版 ── */
.page{padding-top:var(--s4)}
.page-head{max-width:40em}
h1{font-size:clamp(40px,7cqi,56px);line-height:1.25;font-weight:900}
h2.sec{font-size:clamp(26px,4cqi,32px);line-height:1.4;font-weight:700}
.lede{font-size:clamp(18px,2.4cqi,20px);line-height:1.8;margin-top:var(--s3);max-width:34em}
section.block{margin-top:var(--s7);border-top:2px solid var(--ink);padding-top:var(--s2)}
section.block>p,.sec-lede{max-width:36em;margin-top:var(--s2)}
.cta{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4)}
.hero{display:grid;gap:var(--s4)}
.hero-map .map{height:clamp(300px,52cqi,440px)}
@container app (min-width:700px){.hero{grid-template-columns:minmax(0,5fr) minmax(0,4fr);align-items:start}}
@container app (min-width:1000px){.hero{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}}
.paths{display:grid;gap:0;margin-top:var(--s3)}
.path{padding-block:var(--s3);border-top:1px solid var(--rule)}
.path:first-child{border-top:0}
.path h3{font-size:20px;line-height:1.5}
.path p{font-size:16px;line-height:1.7;margin-top:var(--s1)}
.path .here{color:var(--accent);font-weight:700;font-size:14px}
@container app (min-width:700px){.paths{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4)}.path{border-top:0}}
.invite{display:grid;gap:var(--s3)}
@container app (min-width:700px){.invite{grid-template-columns:minmax(0,1fr) auto;align-items:end}}

/* ── 地圖 ── */
.map{position:relative;background:var(--sea);overflow:hidden;border:1px solid var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.map.pick{cursor:crosshair}
.map.static{cursor:default;touch-action:auto}
.map svg{display:block;width:100%;height:100%}
.map-zoom{position:absolute;top:var(--s2);right:var(--s2);display:grid;gap:0;z-index:2}
.map-zoom button{width:44px;height:44px;background:var(--paper);border:1px solid var(--ink);cursor:pointer;font-size:20px;line-height:1;display:grid;place-items:center}
.map-zoom button+button{border-top:0}
.map-zoom button:hover{background:var(--ink);color:var(--paper)}
.map-zoom .fit{font-size:13px}
.map-stamp{position:absolute;left:var(--s2);top:var(--s2);background:var(--paper);border:1px solid var(--ink);padding:0 8px;font-size:14px;line-height:1.7;z-index:2;pointer-events:none}
.m-neigh{fill:var(--land2)}
.m-county{fill:var(--land)}
.m-vill{fill:transparent;stroke:var(--rule2);stroke-width:.6px;vector-effect:non-scaling-stroke}
.m-vill.sel{stroke:var(--ink);stroke-width:2.5px}
.m-road{fill:none;stroke:var(--road);vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.m-road.motorway{stroke-width:1.6px}.m-road.trunk{stroke-width:1.1px}.m-road.primary{stroke-width:.7px}
.m-town{fill:none;stroke:var(--rule);stroke-width:1px;vector-effect:non-scaling-stroke}
.m-edge{fill:none;stroke:var(--ink);stroke-width:1.4px;vector-effect:non-scaling-stroke}
.m-label{fill:var(--ink);font-family:var(--ui);font-weight:500;text-anchor:middle;paint-order:stroke;stroke:var(--land);stroke-linejoin:round;pointer-events:none}
.m-cell{stroke:var(--paper);stroke-width:.5px;vector-effect:non-scaling-stroke}
.m-cell.sel{stroke:var(--ink);stroke-width:2.5px}
.m-raw{fill:none;stroke:var(--ink);stroke-width:5px;stroke-linecap:round;vector-effect:non-scaling-stroke}
.m-hatchline{stroke:var(--hatch);stroke-width:1.2}
.fq1{fill:var(--q1)}.fq2{fill:var(--q2)}.fq3{fill:var(--q3)}.fq4{fill:var(--q4)}.fq5{fill:var(--q5)}
.legend{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);align-items:center;margin-top:var(--s2);font-size:14px;line-height:1.5}
.legend .ramp{display:flex;gap:0;align-items:stretch}
.legend .ramp span{display:grid;gap:2px;font-size:14px;text-align:center;min-width:44px}
.legend .ramp i{display:block;height:12px}
.legend .sw{display:inline-block;width:18px;height:12px;border:1px solid var(--rule);vertical-align:-1px;margin-right:6px}
.sw-hatch{background:repeating-linear-gradient(45deg,var(--land) 0 3px,var(--hatch) 3px 4px)}
.bg1{background:var(--q1)}.bg2{background:var(--q2)}.bg3{background:var(--q3)}.bg4{background:var(--q4)}.bg5{background:var(--q5)}
figcaption{font-size:14px;line-height:1.6;color:var(--muted);margin-top:var(--s2)}

/* ── 記錄流程 ── */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s1);margin-top:var(--s3)}
.steps button{all:unset;cursor:pointer;display:block;border-top:4px solid var(--rule2);padding-top:6px;font-size:15px;line-height:1.4;color:var(--muted)}
.steps button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.steps button.done{border-top-color:var(--ink);color:var(--ink)}
.steps button[aria-current="step"]{border-top-color:var(--accent);color:var(--ink);font-weight:700}
.steps b{display:block;font-weight:700;font-size:14px}
.rec-grid{display:grid;gap:var(--s4);margin-top:var(--s4);align-items:start}
@container app (min-width:700px){.rec-grid{grid-template-columns:minmax(0,7fr) minmax(0,4fr)}}
.form-sec{margin-top:var(--s4);display:grid;gap:var(--s2)}
.form-sec:first-of-type{margin-top:var(--s3)}
.form-sec h3{font-size:20px;line-height:1.5;font-weight:700}
.form-sec h3 small{font-size:14px;font-weight:400;color:var(--muted);margin-left:var(--s1)}
.rec-form>h2{font-size:clamp(26px,4cqi,32px);line-height:1.4;font-weight:700}
.step-note{font-size:16px;line-height:1.7;margin-top:var(--s1)}
.safe{border-left:4px solid var(--ink);padding-left:12px;font-size:16px;line-height:1.7;margin-top:var(--s2)}
.demo{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;margin-top:var(--s2)}
.demo button{min-height:44px;padding:0 12px;border:1px dashed var(--ink);background:none;cursor:pointer;font-size:15px}
.demo button:hover{background:var(--ink);color:var(--paper)}
.photo-row{display:grid;gap:var(--s2);grid-template-columns:minmax(0,1fr)}
.photo-pick{display:flex;flex-wrap:wrap;gap:var(--s2)}
.photo-box{aspect-ratio:3/2;max-width:100%;background:var(--paper2);border:1px solid var(--ink);overflow:hidden;position:relative}
.photo-box img,.photo-box svg{display:block;width:100%;height:100%;object-fit:cover}

}
@container app (min-width:700px){.rec-cards{position:sticky;top:var(--s3);max-height:calc(100vh - 32px);overflow-y:auto}.latest{display:none}}

.sv-grid{display:grid;gap:var(--s5);margin-top:var(--s4)}
